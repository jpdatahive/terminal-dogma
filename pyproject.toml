[project]
name = "terminal-dogma"
version = "2.0.0.dev0"
description = "Sistema de deliberação temático de Neon Genesis Evangelion com agentes de IA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=1.0",
]

[project.scripts]
dogma = "terminal_dogma.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terminal_dogma"]

[dependency-groups]
dev = [
    "google-genai>=1.0",
    "hypothesis>=6.112",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "time-machine>=2.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/legacy -q"
asyncio_mode = "auto"
markers = [
    "live: testes contra APIs reais de LLM (exigem chave; skipados sem ela)",
]

[tool.coverage.run]
source = ["src/terminal_dogma"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@overload",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
# Código v1 congelado: preservado como referência, fora do pipeline de qualidade.
extend-exclude = ["src/dogma_core", "tests/legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
mypy_path = "src"
packages = ["terminal_dogma"]
strict = true
disallow_untyped_defs = true
warn_return_any = true
